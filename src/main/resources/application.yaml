spring:
  application:
    name: segundo-api-nosql

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

  mongodb:
    uri: ${MONGODB_URI}

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: update
    open-in-view: false

  cache:
    type: redis

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

jwt:
  secret: ${JWT_SECRET}
