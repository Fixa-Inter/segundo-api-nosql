spring:
  application:
    name: segundo-api-nosql

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: true

  mongodb:
    uri: ${MONGODB_URI}

  jpa:
    database: postgresql
    hibernate:
      ddl-auto: validate
    open-in-view: false

  cache:
    type: redis

  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false

jwt:
  secret: ${JWT_SECRET}

firebase:
  project-id: ${FIREBASE_PROJECT_ID:fixa-fead2}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:}
  credentials-json: ${FIREBASE_CREDENTIALS_JSON:}

app:
  jobs:
    checklist-pendencias:
      primeiro-cron: ${JOB_CHECKLIST_PENDENCIAS_PRIMEIRO_CRON:0 0 10 * * *}
      segundo-cron: ${JOB_CHECKLIST_PENDENCIAS_SEGUNDO_CRON:0 15 18 * * *}

management:
  health:
      mail:
        enabled: false
      redis:
        enabled: false

  endpoints:
    web:
      exposure:
        include: health
